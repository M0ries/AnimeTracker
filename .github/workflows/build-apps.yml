name: Build desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
            bundles: dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS-Intel
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run test:portable
      - run: npm run app:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: AnimeTracker-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AnimeTracker-*
          path: packages
      - name: Publish direct downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp packages/AnimeTracker-macOS-Apple-Silicon/*.dmg AnimeTracker-macOS-Apple-Silicon.dmg
          cp packages/AnimeTracker-macOS-Intel/*.dmg AnimeTracker-macOS-Intel.dmg
          cp packages/AnimeTracker-Windows-x64/*.exe AnimeTracker-Windows-x64.exe
          tag="desktop-${{ github.run_number }}"
          gh release create "$tag" AnimeTracker-macOS-Apple-Silicon.dmg AnimeTracker-macOS-Intel.dmg AnimeTracker-Windows-x64.exe \
            --target "$GITHUB_SHA" --title "AnimeTracker desktop build ${{ github.run_number }}" \
            --notes 'Unsigned desktop builds. macOS and Windows may require manual trust confirmation. iOS IPA is not included.' \
            --latest
